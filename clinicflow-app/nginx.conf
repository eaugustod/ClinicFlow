server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de Segurança HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy (ajustado para o Supabase & Google Fonts)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://supabase.erpclinicflow.cloud wss://supabase.erpclinicflow.cloud;
        img-src 'self' data: blob: https:;
        frame-ancestors 'none';
        base-uri 'self';
    " always;

    # Cache para arquivos estáticos
    location ~* \.(js|css|woff|woff2|ttf|png|jpg|jpeg|ico|svg|json)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~* \.(sql|env|sh|yml|yaml|md|log|bak)$ {
        deny all;
        return 404;
    }

    # Rota principal (suporte a roteamento SPA de React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;
}
