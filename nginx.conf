server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Headers de Segurança HTTP ─────────────────────────────────────────
    # Impede que o site seja carregado em iframes (clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Impede que o browser adivinhe o Content-Type
    add_header X-Content-Type-Options "nosniff" always;

    # Habilita filtro XSS nos browsers mais antigos
    add_header X-XSS-Protection "1; mode=block" always;

    # Controla informações enviadas no Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restringe uso de câmera, microfone e geolocalização
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — aplicado via header HTTP (mais seguro que <meta>)
    # Inclui o domínio customizado do Supabase hospedado no Coolify
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com data:;
        connect-src 'self'
            https://*.supabase.co wss://*.supabase.co
            https://supabase.erpclinicflow.cloud wss://supabase.erpclinicflow.cloud
            https://cdn.jsdelivr.net;
        img-src 'self' data: blob: https:;
        frame-ancestors 'none';
        base-uri 'self';
    " always;

    # ── Cache para arquivos estáticos ─────────────────────────────────────
    location ~* \.(js|css|woff|woff2|ttf|png|jpg|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Bloquear acesso a arquivos sensíveis ─────────────────────────────
    # Retorna 404 para arquivos que não devem ser acessíveis via URL
    location ~* \.(sql|env|sh|yml|yaml|md|log|bak)$ {
        deny all;
        return 404;
    }

    # Bloquear acesso a arquivos de patch/desenvolvimento
    location ~* (-fixes\.js|-import-fixes\.js|clinicflow\.html)$ {
        deny all;
        return 404;
    }

    # ── Rota principal ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compressão Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;
}
